name: Public kernel checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and source-integrity tests
        run: node --test tests/*.test.mjs
      - name: Offline research CLI (synthetic only)
        run: node research/offline-v0/cli.mjs research/offline-v0/fixtures/synthetic.json
