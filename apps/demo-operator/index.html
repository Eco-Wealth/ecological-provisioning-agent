<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecological Provisioning Agent Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">Demo only</p>
      <h1>Ecological Provisioning Agent</h1>
      <p>Convert civic and ecological intent into principle lenses, routes, packets, proof plans, and receipts.</p>
      <p class="boundary">Does not certify, dispatch labor, move funds, deploy systems, post publicly, or verify outcomes.</p>
    </section>

    <section class="grid">
      <article>
        <h2>1. Intent</h2>
        <textarea id="intent">Owner has a degraded lot and wants it safer, more beautiful, more water-aware, and easier to maintain.</textarea>
        <button id="run">Generate demo packet</button>
      </article>
      <article>
        <h2>2. Output</h2>
        <pre id="output"></pre>
      </article>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
